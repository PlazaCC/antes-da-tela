name: Deploy (Vercel)

# Each run: database migrations → Vercel build → deploy.
# Deploys are made here, with a Vercel token, instead of Vercel's Git
# integration: commits authored by people/bots outside the Vercel team are
# refused there. Only `dev` (preview, dev services) and `main` (production)
# deploy; PR and feature branches never do (git.deploymentEnabled=false in
# vercel.json).

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VERCEL_CLI: vercel@64.3.1
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  # main → Production env vars; dev → Preview env vars of the `dev` branch.
  VERCEL_TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
  PROD_FLAG: ${{ github.ref_name == 'main' && '--prod' || '' }}
  # Branch-specific overrides exist only for Preview: the Vercel API refuses
  # `--git-branch` with `--environment=production`.
  GIT_BRANCH_FLAG: ${{ github.ref_name != 'main' && format('--git-branch={0}', github.ref_name) || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub environments (already created by the Vercel integration): secrets can
    # live there or at repository level; Production can require reviewers.
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Cache Yarn and node_modules
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      # Migrations run before the new code goes live (they are additive), against
      # the database of this environment. A failure stops the deploy — fix by hand
      # (CLAUDE.md: no workarounds). Secret DATABASE_URL_UNPOOLED lives in each
      # GitHub environment (Production / Preview); use the Session pooler URL.
      - name: Apply database migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Secret DATABASE_URL_UNPOOLED is not set for the ${{ github.ref_name == 'main' && 'Production' || 'Preview' }} environment"
            exit 1
          fi
          yarn db:migrate:verbose

      - name: Pull Vercel settings and env vars
        run: npx --yes $VERCEL_CLI pull --yes --environment=$VERCEL_TARGET $GIT_BRANCH_FLAG --token=$VERCEL_TOKEN

      # `vercel pull` writes "[SENSITIVE]" for Sensitive variables. NEXT_PUBLIC_*
      # are inlined in the bundle at build time, so the site would ship with
      # that literal instead of the key: stop here and name the variables.
      - name: Check public env vars
        run: |
          sensitive=$(grep -oE '^NEXT_PUBLIC_[A-Z0-9_]+="\[SENSITIVE\]"' ".vercel/.env.$VERCEL_TARGET.local" | cut -d= -f1 || true)
          if [ -n "$sensitive" ]; then
            echo "::error::Vercel ($VERCEL_TARGET) has NEXT_PUBLIC_* variables marked Sensitive, which the build cannot read: $(echo $sensitive). Recreate them without Sensitive (docs/DEPLOY.md)."
            exit 1
          fi

      - name: Build
        # Vercel "Sensitive" variables are not returned by `vercel pull`: the
        # Sentry source-map upload token comes from GitHub secrets instead.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npx --yes $VERCEL_CLI build $PROD_FLAG --token=$VERCEL_TOKEN

      - name: Deploy
        id: deploy
        # Assign first: inside `echo "$(...)"` a failed deploy did not fail the step.
        run: |
          url=$(npx --yes $VERCEL_CLI deploy --prebuilt $PROD_FLAG --token=$VERCEL_TOKEN)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Preview deployments get a random URL: point the fixed dev domain at it.
      - name: Alias dev domain
        if: github.ref_name == 'dev' && vars.VERCEL_DEV_DOMAIN != ''
        run: npx --yes $VERCEL_CLI alias set ${{ steps.deploy.outputs.url }} ${{ vars.VERCEL_DEV_DOMAIN }} --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID

      - name: Summary
        run: echo "Deployed ${{ github.ref_name }} → ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
